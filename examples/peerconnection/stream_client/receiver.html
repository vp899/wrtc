<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WebRTC Stream Receiver</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #1a1a2e;
    color: #eee;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }
  h1 { font-size: 1.5em; margin-bottom: 20px; color: #00d4ff; }
  .container {
    background: #16213e;
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    max-width: 700px;
    width: 100%;
  }
  .form-row {
    display: flex; gap: 12px; margin-bottom: 16px;
    align-items: center; flex-wrap: wrap;
  }
  label { font-size: 0.9em; color: #aaa; min-width: 80px; }
  input[type="text"] {
    background: #0f3460; border: 1px solid #1a5276; color: #eee;
    padding: 8px 12px; border-radius: 6px; font-size: 0.95em;
    flex: 1; min-width: 120px;
  }
  input:focus { outline: none; border-color: #00d4ff; }
  button {
    background: #0f3460; color: #00d4ff; border: 1px solid #00d4ff;
    padding: 8px 20px; border-radius: 6px; cursor: pointer;
    font-size: 0.95em; transition: all 0.2s;
  }
  button:hover { background: #00d4ff; color: #0f3460; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .status {
    margin: 12px 0; padding: 10px; border-radius: 6px;
    font-size: 0.9em; background: #0a1628; min-height: 28px;
  }
  .status.connected { border-left: 3px solid #00ff88; }
  .status.error { border-left: 3px solid #ff4444; }
  .status.info { border-left: 3px solid #00d4ff; }
  #remoteVideo {
    width: 100%; max-width: 640px; background: #000;
    border-radius: 8px; margin-top: 16px;
  }
  .video-container { position: relative; display: flex; justify-content: center; margin-top: 16px; }
  #delayOverlay {
    position: absolute; top: 8px; left: 8px;
    background: rgba(0,0,0,0.75); color: #00ff88;
    font-family: 'Consolas', 'Monaco', monospace; font-size: 13px;
    padding: 8px 12px; border-radius: 6px;
    line-height: 1.6; pointer-events: none;
    min-width: 220px;
  }
  #delayOverlay .label { color: #aaa; }
  #delayOverlay .value { color: #00ff88; font-weight: bold; }
  #delayOverlay .value.warn { color: #ffaa00; }
  #delayOverlay .value.bad  { color: #ff4444; }
  #log {
    margin-top: 16px; max-height: 300px; overflow-y: auto;
    font-family: 'Consolas', 'Monaco', monospace; font-size: 0.8em;
    background: #0a1628; padding: 12px; border-radius: 6px;
    white-space: pre-wrap; word-break: break-all;
  }
  .log-entry { margin: 2px 0; }
  .log-entry.info { color: #00d4ff; }
  .log-entry.error { color: #ff4444; }
  .log-entry.recv { color: #00ff88; }
  .log-entry.send { color: #ffaa00; }
</style>
</head>
<body>
<h1>📡 WebRTC Stream Receiver</h1>
<div class="container">
  <div class="form-row">
    <label>Server:</label>
    <input type="text" id="server" value="http://192.168.96.129:8888">
  </div>
  <div class="form-row">
    <label>Stream ID:</label>
    <input type="text" id="streamId" value="stream_001">
  </div>
  <div class="form-row">
    <label>STUN:</label>
    <input type="text" id="stunServer" value="stun:192.168.96.129:3478" placeholder="stun:host:port (optional)">
  </div>
  <div class="form-row">
    <button id="connectBtn" onclick="connect()">Connect</button>
    <button id="disconnectBtn" onclick="disconnect()" disabled>Disconnect</button>
  </div>
  <div id="status" class="status info">Ready.</div>
  <div class="video-container">
    <video id="remoteVideo" autoplay playsinline></video>
    <div id="delayOverlay">Waiting for stream...</div>
  </div>
  <div id="log"></div>
</div>

<script>
var server = '';
var streamId = '';
var myId = -1;
var peerId = -1;
var otherPeers = {};
var pc = null;
var hangingGet = null;
var request = null;

var iceServers = [];

// ============ Delay Measurement ============
var delayHistory = [];        // last N delay values (ms)
var DELAY_WINDOW = 30;        // sliding window size
var statsTimer = null;
var frameCount = 0;
var lastStatsTime = 0;
var lastFrameCount = 0;
var lastBytesReceived = 0;
var currentFps = 0;
var actualBitrate = 0;       // kbps
var availableBitrate = 0;    // kbps

function delayClass(ms) {
  if (ms < 100) return 'value';
  if (ms < 300) return 'value warn';
  return 'value bad';
}

function updateDelayOverlay(rttMs) {
  var oneWayMs = rttMs / 2;
  delayHistory.push(oneWayMs);
  if (delayHistory.length > DELAY_WINDOW) delayHistory.shift();

  var sum = 0;
  for (var i = 0; i < delayHistory.length; i++) sum += delayHistory[i];
  var avgMs = sum / delayHistory.length;

  var minMs = Math.min.apply(null, delayHistory);
  var maxMs = Math.max.apply(null, delayHistory);

  var el = document.getElementById('delayOverlay');
  el.innerHTML =
    '<div><span class="label">RTT: </span><span class="' + delayClass(rttMs) + '">' + rttMs.toFixed(1) + ' ms</span></div>' +
    '<div><span class="label">One-way delay: </span><span class="' + delayClass(oneWayMs) + '">' + oneWayMs.toFixed(1) + ' ms</span></div>' +
    '<div><span class="label">Avg(' + delayHistory.length + '): </span><span class="' + delayClass(avgMs) + '">' + avgMs.toFixed(1) + ' ms</span></div>' +
    '<div><span class="label">Min: </span><span class="value">' + minMs.toFixed(1) + ' ms</span>' +
    ' <span class="label">Max: </span><span class="value">' + maxMs.toFixed(1) + ' ms</span></div>' +
    '<div><span class="label">Actual BW: </span><span class="value">' + actualBitrate.toFixed(0) + ' kbps</span></div>' +
    '<div><span class="label">Avail BW: </span><span class="value">' + availableBitrate.toFixed(0) + ' kbps</span></div>' +
    '<div><span class="label">Frames: </span><span class="value">' + frameCount + '</span>' +
    ' <span class="label">FPS: </span><span class="value">' + currentFps + '</span></div>';
}

function collectStats() {
  if (!pc) return;
  var now = Date.now();
  pc.getStats(null).then(function(stats) {
    stats.forEach(function(report) {
      if (report.type === 'candidate-pair' && report.state === 'succeeded') {
        if (report.currentRoundTripTime !== undefined) {
          updateDelayOverlay(report.currentRoundTripTime * 1000);
        }
        if (report.availableOutgoingBitrate !== undefined) {
          availableBitrate = report.availableOutgoingBitrate / 1000;
        }
      }
      if (report.type === 'inbound-rtp' && report.kind === 'video') {
        frameCount = report.framesDecoded || 0;
        var bytesNow = report.bytesReceived || 0;
        if (lastStatsTime > 0) {
          var elapsed = (now - lastStatsTime) / 1000;
          var framesDiff = frameCount - lastFrameCount;
          currentFps = Math.round(framesDiff / elapsed);
          actualBitrate = ((bytesNow - lastBytesReceived) * 8) / elapsed / 1000;
        }
        lastFrameCount = frameCount;
        lastBytesReceived = bytesNow;
        lastStatsTime = now;
      }
    });
  });
}

function log(msg, cls) {
  var el = document.getElementById('log');
  var d = document.createElement('div');
  d.className = 'log-entry ' + (cls || 'info');
  var t = new Date();
  d.textContent = '[' + t.toLocaleTimeString() + '.' + String(t.getMilliseconds()).padStart(3,'0') + '] ' + msg;
  el.appendChild(d);
  el.scrollTop = el.scrollHeight;
  console.log(msg);
}

function setStatus(msg, cls) {
  var el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status ' + (cls || 'info');
}

function getHeaderInt(r, name) {
  var v = r.getResponseHeader(name);
  return v != null && v.length ? parseInt(v) : -1;
}

// ============ Signaling ============

function signIn() {
  try {
    request = new XMLHttpRequest();
    request.onreadystatechange = signInCallback;
    request.open('GET', server + '/sign_in?browser_receiver', true);
    request.send();
  } catch (e) {
    log('Sign in error: ' + e, 'error');
  }
}

function signInCallback() {
  try {
    if (request.readyState != 4) return;
    if (request.status != 200) {
      log('Sign in failed: status=' + request.status, 'error');
      return;
    }
    var peers = request.responseText.split('\n');
    myId = parseInt(peers[0].split(',')[1]);
    log('Signed in. My ID: ' + myId, 'info');
    log('Raw response: ' + request.responseText.replace(/\n/g, ' | '), 'info');

    for (var i = 1; i < peers.length; ++i) {
      if (peers[i].length > 0) {
        var parsed = peers[i].split(',');
        var id = parseInt(parsed[1]);
        var name = parsed[0];
        var connected = parseInt(parsed[2]);
        log('  Peer: name=' + name + ' id=' + id + ' connected=' + connected, 'info');
        if (connected) {
          otherPeers[id] = name;
          if (name === streamId && peerId == -1) {
            peerId = id;
            log('>>> Found "' + streamId + '" in peer list! peerId=' + peerId, 'recv');
            startCall();
          }
        }
      }
    }
    if (peerId == -1) {
      log('"' + streamId + '" not in initial list, waiting for notification...', 'info');
    }
    request = null;
    startHangingGet();
  } catch (e) {
    log('signInCallback error: ' + e, 'error');
  }
}

function startHangingGet() {
  try {
    var hg = new XMLHttpRequest();
    hg.onreadystatechange = function() {
      try {
        if (hg.readyState != 4) return;
        if (hg.status == 200) {
          var recvPeerId = getHeaderInt(hg, 'Pragma');
          var body = hg.responseText;
          log('[HG] Pragma=' + recvPeerId + ' myId=' + myId + ' body=' + body.substring(0, 150), 'info');

          if (recvPeerId == myId) {
            handleServerNotification(body);
          } else {
            log('>>> Message from peer ' + recvPeerId, 'recv');
            handlePeerMessage(recvPeerId, body);
          }
        } else if (hg.status == 0) {
          // Timeout or network error - just retry, don't disconnect
          log('[HG] Timeout/error, retrying...', 'info');
        } else {
          log('[HG] Server error: ' + hg.status + ' ' + hg.statusText, 'error');
        }
      } catch (e) {
        log('[HG] callback error: ' + e, 'error');
      }
      // Always retry if still connected
      if (myId != -1) setTimeout(startHangingGet, 500);
    };
    hg.ontimeout = function() {
      log('[HG] Request timeout, retrying...', 'info');
      if (myId != -1) setTimeout(startHangingGet, 500);
    };
    hg.open('GET', server + '/wait?peer_id=' + myId, true);
    hg.timeout = 60000;
    hg.send();
    hangingGet = hg;
  } catch (e) {
    log('[HG] start error: ' + e, 'error');
    if (myId != -1) setTimeout(startHangingGet, 1000);
  }
}

function handleServerNotification(data) {
  var parsed = data.split(',');
  var name = parsed[0];
  var id = parseInt(parsed[1]);
  var connected = parseInt(parsed[2]);
  log('[Notify] ' + name + ' id=' + id + ' connected=' + connected, 'info');

  if (connected) {
    otherPeers[id] = name;
    if (name === streamId && peerId == -1) {
      peerId = id;
      log('>>> Target stream connected! peerId=' + peerId, 'recv');
      startCall();
    }
  } else {
    delete otherPeers[id];
    if (id == peerId) {
      log('Stream sender disconnected!', 'error');
      setStatus('Stream disconnected', 'error');
      peerId = -1;
      if (pc) { pc.close(); pc = null; }
    }
  }
}

function handlePeerMessage(fromPeerId, data) {
  log('[PeerMsg] from=' + fromPeerId + ' data=' + data.substring(0, 200), 'recv');

  if (!pc) {
    log('No PeerConnection, ignoring', 'error');
    return;
  }

  var msg;
  try { msg = JSON.parse(data); } catch (e) {
    log('JSON parse error', 'error');
    return;
  }

  if (msg.type === 'answer') {
    log('Setting remote description (answer)...', 'recv');
    pc.setRemoteDescription(new RTCSessionDescription(msg))
      .then(function() { log('Remote description set OK', 'recv'); })
      .catch(function(e) { log('setRemoteDescription failed: ' + e, 'error'); });
  } else if (msg.candidate) {
    log('Adding ICE candidate...', 'recv');
    pc.addIceCandidate(new RTCIceCandidate(msg))
      .then(function() { log('ICE candidate added', 'recv'); })
      .catch(function(e) { log('addIceCandidate failed: ' + e, 'error'); });
  }
}

function sendToPeer(targetPeerId, data) {
  if (myId == -1) { log('Not connected', 'error'); return; }
  if (targetPeerId == myId) { log('Cannot send to self', 'error'); return; }
  try {
    var r = new XMLHttpRequest();
    r.open('POST', server + '/message?peer_id=' + myId + '&to=' + targetPeerId, false);
    r.setRequestHeader('Content-Type', 'text/plain');
    r.send(data);
    log('[Sent] to=' + targetPeerId + ' status=' + r.status + ' data=' + data.substring(0, 100), 'send');
  } catch (e) {
    log('Send error: ' + e, 'error');
  }
}

// ============ WebRTC ============

function startCall() {
  if (peerId == -1) { log('No peer ID', 'error'); return; }

  log('>>> Starting call to peer ' + peerId + ' (' + streamId + ')', 'info');
  setStatus('Connecting to ' + streamId + '...', 'info');
  log('ICE servers: ' + JSON.stringify(iceServers), 'info');

  pc = new RTCPeerConnection({ iceServers: iceServers });

  pc.onicecandidate = function(e) {
    if (e.candidate) {
      log('ICE candidate: ' + e.candidate.candidate, 'send');
      sendToPeer(peerId, JSON.stringify(e.candidate));
    } else {
      log('All ICE candidates sent', 'send');
    }
  };

  pc.ontrack = function(e) {
    log('>>> Remote track: ' + e.track.kind, 'recv');
    if (e.streams && e.streams[0]) {
      document.getElementById('remoteVideo').srcObject = e.streams[0];
      setStatus('Streaming!', 'connected');
      // Start collecting stats for delay measurement
      if (statsTimer) clearInterval(statsTimer);
      delayHistory = [];
      frameCount = 0;
      lastStatsTime = 0;
      lastFrameCount = 0;
      currentFps = 0;
      statsTimer = setInterval(collectStats, 1000);
    }
  };

  pc.oniceconnectionstatechange = function() {
    log('ICE state: ' + pc.iceConnectionState, 'info');
    if (pc.iceConnectionState === 'connected') setStatus('Connected!', 'connected');
    if (pc.iceConnectionState === 'failed') setStatus('Connection failed', 'error');
    if (pc.iceConnectionState === 'disconnected') setStatus('Disconnected', 'error');
  };

  pc.onsignalingstatechange = function() {
    log('Signaling state: ' + pc.signalingState, 'info');
  };

  // Add transceiver to receive video
  pc.addTransceiver('video', { direction: 'recvonly' });

  // DataChannel for remote control (will be created by sender,
  // but we also create one to ensure it exists)
  var dc = pc.createDataChannel('control');
  dc.onopen = function() { log('DataChannel opened', 'recv'); setupMouseDrag(dc); };
  dc.onclose = function() { log('DataChannel closed', 'info'); };

  pc.ondatachannel = function(e) {
    log('DataChannel received: ' + e.channel.label, 'recv');
    e.channel.onopen = function() { log('DataChannel opened', 'recv'); setupMouseDrag(e.channel); };
  };

  pc.createOffer()
    .then(function(offer) {
      log('Offer created, setting local description...', 'send');
      return pc.setLocalDescription(offer);
    })
    .then(function() {
      log('>>> Sending offer to peer ' + peerId, 'send');
      sendToPeer(peerId, JSON.stringify(pc.localDescription));
    })
    .catch(function(e) {
      log('Offer failed: ' + e, 'error');
      setStatus('Failed: ' + e, 'error');
    });
}

// ============ Mouse Drag Control ============
var dragChannel = null;
var isDragging = false;

function setupMouseDrag(channel) {
  dragChannel = channel;
  var video = document.getElementById('remoteVideo');

  function sendPos(e) {
    if (!dragChannel || dragChannel.readyState !== 'open') return;
    var rect = video.getBoundingClientRect();
    // Map mouse position to 320x240 video coordinates
    var scaleX = 320 / rect.width;
    var scaleY = 240 / rect.height;
    var vx = Math.round((e.clientX - rect.left) * scaleX);
    var vy = Math.round((e.clientY - rect.top) * scaleY);
    vx = Math.max(0, Math.min(320, vx));
    vy = Math.max(0, Math.min(240, vy));
    dragChannel.send(vx + ',' + vy);
  }

  video.addEventListener('mousedown', function(e) {
    isDragging = true;
    sendPos(e);
    e.preventDefault();
  });

  document.addEventListener('mousemove', function(e) {
    if (!isDragging) return;
    sendPos(e);
    e.preventDefault();
  });

  document.addEventListener('mouseup', function() {
    isDragging = false;
  });

  log('Mouse drag control enabled (drag circle to move it)', 'info');
}

// ============ UI ============

function connect() {
  // Clean up any existing connection first
  if (myId != -1) disconnect();

  server = document.getElementById('server').value.trim();
  streamId = document.getElementById('streamId').value.trim();
  if (!server || !streamId) { alert('Please fill in both fields'); return; }

  // Build ICE servers from STUN input
  iceServers = [];
  var stunUri = document.getElementById('stunServer').value.trim();
  if (stunUri) {
    iceServers.push({ urls: stunUri });
    log('Using STUN server: ' + stunUri, 'info');
  } else {
    log('No STUN server configured (direct connection only)', 'info');
  }

  document.getElementById('connectBtn').disabled = true;
  document.getElementById('disconnectBtn').disabled = false;
  setStatus('Connecting to signaling server...', 'info');
  log('Connecting to ' + server + ' looking for "' + streamId + '"', 'info');
  signIn();
}

function disconnect() {
  log('Disconnecting...', 'info');
  if (statsTimer) { clearInterval(statsTimer); statsTimer = null; }
  if (pc) { pc.close(); pc = null; }
  if (hangingGet) { hangingGet.abort(); hangingGet = null; }
  if (request) { request.abort(); request = null; }
  if (myId != -1) {
    try {
      var r = new XMLHttpRequest();
      r.open('GET', server + '/sign_out?peer_id=' + myId, false);
      r.send();
    } catch (e) {}
    myId = -1;
  }
  peerId = -1;
  otherPeers = {};
  document.getElementById('remoteVideo').srcObject = null;
  document.getElementById('connectBtn').disabled = false;
  document.getElementById('disconnectBtn').disabled = true;
  setStatus('Disconnected', 'info');
}

window.onbeforeunload = disconnect;
</script>
</body>
</html>
